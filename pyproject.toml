[project]
name = "ecg-interp"
version = "0.1.0"
description = "Mechanistic interpretability of ECG foundation models: shared vs. model-specific representations of clinical concepts"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
